version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: proyecto_escuela_frontend:latest
    # Map host port 8081 -> container 80 to avoid conflict with an existing backend on 8080
    # You can change the left side (host) to any free port on your VPS.
    ports:
      - "8081:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

# If you have a backend to proxy to, you can add it below and connect networks
# networks:
#   appnet:
#     driver: bridge
